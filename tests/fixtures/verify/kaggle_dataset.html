    <script nonce="HhUFPuHzblO6AZBETscesw==" type="application/ld+json">{"@context":"http://schema.org/","@type":"Dataset","name":"Parkinson Disease Detection","description":"### Context\n\nParkinson’s Disease (PD) is a degenerative neurological disorder marked by decreased dopamine levels in the brain. It manifests itself through a deterioration of movement, including the presence of tremors and stiffness. There is commonly a marked effect on speech, including dysarthria (difficulty articulating sounds), hypophonia (lowered volume), and monotone (reduced pitch range). Additionally, cognitive impairments and changes in mood can occur, and risk of\ndementia is increased. \n\nTraditional diagnosis of Parkinson’s Disease involves a clinician taking a neurological history of the patient and observing motor skills in various situations. Since there is no definitive laboratory test to diagnose PD, diagnosis is often difficult, particularly in the early stages when motor effects are not yet severe. Monitoring progression of the disease over time requires repeated clinic visits by the patient. An effective screening process, particularly one that doesn’t require a clinic visit, would be beneficial. Since PD patients exhibit characteristic vocal features, voice recordings are a useful and non-invasive tool for diagnosis. If machine learning algorithms could be applied to a voice recording dataset to accurately diagnosis PD, this would be an effective screening step prior to an appointment with a clinician. \n\n### Data\n\nThe data &amp; attributes information for this project is available at https://archive.ics.uci.edu/ml/machine-learning-databases/parkinsons/\n\n### Attribute Information:\n\nMatrix column entries (attributes):\nname - ASCII subject name and recording number\nMDVP:Fo(Hz) - Average vocal fundamental frequency\nMDVP:Fhi(Hz) - Maximum vocal fundamental frequency\nMDVP:Flo(Hz) - Minimum vocal fundamental frequency\nMDVP:Jitter(%),MDVP:Jitter(Abs),MDVP:RAP,MDVP:PPQ,Jitter:DDP - Several \nmeasures of variation in fundamental frequency\nMDVP:Shimmer,MDVP:Shimmer(dB),Shimmer:APQ3,Shimmer:APQ5,MDVP:APQ,Shimmer:DDA - Several measures of variation in amplitude\nNHR,HNR - Two measures of ratio of noise to tonal components in the voice\nstatus - Health status of the subject (one) - Parkinson's, (zero) - healthy\nRPDE,D2 - Two nonlinear dynamical complexity measures\nDFA - Signal fractal scaling exponent\nspread1,spread2,PPE - Three nonlinear measures of fundamental frequency variation \n\n### Citation Request:\n\nIf you use this dataset, please cite the following paper: \n'Exploiting Nonlinear Recurrence and Fractal Scaling Properties for Voice Disorder Detection', \nLittle MA, McSharry PE, Roberts SJ, Costello DAE, Moroz IM. \nBioMedical Engineering OnLine 2007, 6:23 (26 June 2007)","url":"https://www.kaggle.com/debasisdotcom/parkinson-disease-detection","version":2,"keywords":["subject, earth and nature","task, classification","subject, science and technology, computer science","technique, feature engineering","subject, health and fitness, health, health conditions, diseases"],"license":{"@type":"CreativeWork","name":"Other (specified in description)","url":""},"identifier":["907215"],"includedInDataCatalog":{"@type":"DataCatalog","name":"Kaggle","url":"https://www.kaggle.com"},"creator":{"@type":"Person","name":"Debasis Samal","url":"https://www.kaggle.com/debasisdotcom","image":"https://storage.googleapis.com/kaggle-avatars/thumbnails/3766670-kg.jpg"},"distribution":[{"@type":"DataDownload","requiresSubscription":true,"encodingFormat":"zip","fileFormat":"zip","contentUrl":"https://www.kaggle.com/datasets/debasisdotcom/parkinson-disease-detection/download?datasetVersionNumber=2","contentSize":"15179 bytes"}],"commentCount":4,"dateModified":"2020-10-05T13:33:21.737Z","discussionUrl":"https://www.kaggle.com/debasisdotcom/parkinson-disease-detection/discussion","alternateName":"Build a Model to Detect Parkinson disease","isAccessib
